<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign In — HEALTH SPHERE</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../public/i18n.js"></script>
    <style>
      body { font-family: inherit; }
      .center { min-height: 100vh; display:flex; align-items:center; justify-content:center; background:var(--background-main,#f8fbff); }
      .card { background: white; padding: 32px; border-radius:12px; max-width:480px; width:100%; box-shadow: 0 8px 24px rgba(15,23,42,0.06); }
      .brand { display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:18px; }
      .brand .logo { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary-color,#1f6faf),#0f516f); color:white; font-weight:700 }
      .brand .title { font-size:1.25rem; font-weight:700; color:var(--text-primary,#1e293b) }
      .muted { color: var(--text-muted,#64748b); }
      .form-gap { margin-top:12px; }
    </style>
  </head>
  <body>
    <div class="center">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div class="brand">
            <img src="../public/logo.svg" alt="HEALTH SPHERE logo" style="width:48px;height:48px;border-radius:10px;display:block" />
            <div class="title" data-i18n="site_title">HEALTH SPHERE</div>
          </div>
          <div>
            <select id="pageLangSelect" class="input" aria-label="Select language">
              <option value="en">English</option>
              <option value="hi">हिंदी</option>
              <option value="bn">বাংলা</option>
            </select>
          </div>
        </div>

        <p class="muted text-center" data-i18n="sign_in_desc">Sign in with your registered email to continue</p>

        <form id="loginForm" novalidate class="form-gap">
          <label class="block text-sm mb-2" data-i18n="email_label">Email</label>
          <input id="loginEmail" type="email" required class="input w-full mb-4" data-i18n-placeholder="placeholder_email" placeholder="your.email@example.com" />
          <p id="loginEmailError" class="text-sm text-error hidden mb-2"></p>

          <label class="block text-sm mb-2" data-i18n="password_label">Password</label>
          <input id="loginPassword" type="password" required class="input w-full mb-4" data-i18n-placeholder="placeholder_password" placeholder="Enter your password" />
          <p id="loginPasswordError" class="text-sm text-error hidden mb-2"></p>

          <button id="loginBtn" type="submit" class="btn btn-primary w-full py-3" data-i18n="sign_in_btn">Sign In</button>
        </form>

        <div class="text-sm text-center mt-4 muted">
          <span data-i18n="or_text">Don't have an account?</span> <a href="sign_up_screen.html" class="text-primary" data-i18n="sign_up_link">Create one</a>
        </div>
      </div>
    </div>

    <script src="../public/local_translations_data.js"></script>
    <script src="../public/local_translations.js"></script>
    <script>
      // Simple sign-in using localStorage users
      const loginForm = document.getElementById('loginForm');

      function showError(id, msg) {
        const el = document.getElementById(id);
        if(el){ el.textContent = msg; el.classList.remove('hidden'); }
      }
      function hideError(id) { const e = document.getElementById(id); if(e) e.classList.add('hidden'); }

      loginForm.addEventListener('submit', function(e){
        e.preventDefault();
        hideError('loginEmailError'); hideError('loginPasswordError');
        const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
        const password = (document.getElementById('loginPassword').value || '');

          if(!email) { showError('loginEmailError', (window.hsT && window.hsT('inline_enter_email')) || 'Please enter your email'); return; }
          if(!password) { showError('loginPasswordError', (window.hsT && window.hsT('inline_enter_password')) || 'Please enter your password'); return; }

        try {
          const raw = localStorage.getItem('users');
          const users = raw ? JSON.parse(raw) : {};
          const user = users[email];
          if(!user) { showError('loginEmailError', (window.hsT && window.hsT('inline_no_account')) || 'No account found for this email'); return; }
          if(user.password !== password) { showError('loginPasswordError', (window.hsT && window.hsT('inline_incorrect_password')) || 'Incorrect password'); return; }

          // Success: set session and redirect to homepage
          localStorage.setItem('authUser', email);
          window.location.href = 'homepage.html';
        } catch(err) {
          showError('loginEmailError','Unable to read stored accounts');
          console.error(err);
        }
      });
    </script>
  </body>
</html>
